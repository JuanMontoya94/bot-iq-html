        // =================================================================
        // CLIENTE IQ OPTION (WEBSOCKET + SIMULADOR FALLBACK)
        // =================================================================
        class IQOptionWebClient {
            constructor(email, password, modoConexion, corsProxy) {
                this.email = email;
                this.password = password;
                this.modoConexion = modoConexion;
                this.corsProxy = corsProxy.trim();
                this.ws = null;
                this.connected = false;
                this.balances = [];
                this.activeBalance = null;
                this.simCandles = [];
                this.simOrders = new Map();
            }

            async connect() {
                if (this.modoConexion === "SIMULATOR") {
                    this._initSimCandles();
                    this.connected = true;
                    this.activeBalance = { id: 1, amount: 10000.0, type: 4 };
                    return true;
                }

                try {
                    const authUrl = `${this.corsProxy}https://auth.iqoption.com/api/v2/login`;
                    const resp = await fetch(authUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ identifier: this.email, password: this.password })
                    });
                    const data = await resp.json();
                    if (!data.ssid) {
                        logMensaje("❌ Error Auth IQ Option: Verifica credenciales o Proxy CORS.", "error");
                        return false;
                    }
                    state.ssid = data.ssid;

                    return await new Promise((resolve) => {
                        this.ws = new WebSocket("wss://iqoption.com/echo/websocket");
                        this.ws.onopen = () => {
                            this._sendWS("ssid", state.ssid);
                        };
                        this.ws.onmessage = (event) => {
                            const msg = JSON.parse(event.data);
                            if (msg.name === "profile" && msg.msg) {
                                this.balances = msg.msg.balances || [];
                                this.connected = true;
                                resolve(true);
                            }
                            if (msg.request_id && state.pendingRequests.has(msg.request_id)) {
                                const resolver = state.pendingRequests.get(msg.request_id);
                                state.pendingRequests.delete(msg.request_id);
                                resolver(msg);
                            }
                        };
                        this.ws.onerror = () => {
                            logMensaje("❌ Error en WebSocket de IQ Option.", "error");
                            resolve(false);
                        };
                        setTimeout(() => { if (!this.connected) resolve(false); }, 10000);
                    });
                } catch (err) {
                    logMensaje(`⚠️ Fallo de red/CORS: ${err.message}. Usa extensión CORS o Modo Simulador.`, "error");
                    return false;
                }
            }

            _sendWS(name, msg, requestId = null) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    const payload = { name, msg };
                    if (requestId) payload.request_id = requestId;
                    this.ws.send(JSON.stringify(payload));
                }
            }

            _sendWSAsync(name, msg) {
                return new Promise((resolve) => {
                    const reqId = String(state.reqCounter++);
                    state.pendingRequests.set(reqId, resolve);
                    this._sendWS(name, msg, reqId);
                    setTimeout(() => {
                        if (state.pendingRequests.has(reqId)) {
                            state.pendingRequests.delete(reqId);
                            resolve(null);
                        }
                    }, 8000);
                });
            }

            changeBalance(modo) {
                if (this.modoConexion === "SIMULATOR") return;
                // type 1 = REAL, type 4 = PRACTICE
                const targetType = modo === "REAL" ? 1 : 4;
                const found = this.balances.find(b => b.type === targetType);
                if (found) this.activeBalance = found;
            }

            getBalance() {
                if (!this.activeBalance) return 0;
                return parseFloat(this.activeBalance.amount);
            }

            async getCandles(asset, size, count, endtime) {
                if (this.modoConexion === "SIMULATOR") {
                    this._stepSimCandle();
                    return this.simCandles.slice(-count);
                }

                const activeId = ASSET_IDS[asset] || 76;
                const res = await this._sendWSAsync("sendMessage", {
                    name: "get-candles",
                    version: "2.0",
                    body: {
                        active_id: activeId,
                        size: size,
                        to: Math.floor(endtime),
                        count: count
                    }
                });

                if (res && res.msg && Array.isArray(res.msg.candles)) {
                    return res.msg.candles.map(c => ({
                        open: c.open,
                        close: c.close,
                        min: c.min,
                        max: c.max,
                        from: c.from
                    }));
                }
                return [];
            }

            async buy(monto, asset, direction, expirations) {
                if (this.modoConexion === "SIMULATOR") {
                    const idOp = Math.floor(Math.random() * 9000000) + 1000000;
                    const entryPrice = this.simCandles[this.simCandles.length - 1].close;
                    this.simOrders.set(idOp, { monto, direction, entryPrice });
                    this.activeBalance.amount -= monto;
                    return [true, idOp];
                }

                const activeId = ASSET_IDS[asset] || 76;
                const expTime = Math.floor(Date.now() / 1000) + (expirations * 60);
                // Redondear al minuto exacto de expiración binaria/turbo
                const expired = expTime - (expTime % 60);

                const res = await this._sendWSAsync("sendMessage", {
                    name: "binary-options.open-option",
                    version: "1.0",
                    body: {
                        user_balance_id: this.activeBalance.id,
                        active_id: activeId,
                        option_type_id: 3, // Turbo
                        direction: direction.toLowerCase(),
                        expired: expired,
                        price: parseFloat(monto)
                    }
                });

                if (res && res.msg && res.msg.id) {
                    return [true, res.msg.id];
                }
                return [false, null];
            }

            async checkWinV3(idOp) {
                if (this.modoConexion === "SIMULATOR") {
                    const ord = this.simOrders.get(idOp);
                    if (!ord) return null;
                    const currentPrice = this.simCandles[this.simCandles.length - 1].close;
                    const won = (ord.direction === "call" && currentPrice > ord.entryPrice) ||
                                (ord.direction === "put" && currentPrice < ord.entryPrice);
                    if (currentPrice === ord.entryPrice) return 0;
                    if (won) {
                        const profit = ord.monto * 0.85;
                        this.activeBalance.amount += (ord.monto + profit);
                        return profit;
                    } else {
                        return -ord.monto;
                    }
                }

                const res = await this._sendWSAsync("sendMessage", {
                    name: "get-order",
                    version: "1.0",
                    body: { order_id: idOp }
                });

                if (res && res.msg) {
                    if (res.msg.status === "closed") {
                        const winAmount = parseFloat(res.msg.win_amount || 0);
                        const invest = parseFloat(res.msg.amount || 0);
                        return winAmount - invest;
                    }
                }
                return null;
            }

            // Generador realista de velas para modo prueba en GitHub Pages
            _initSimCandles() {
                let price = 1.08500;
                this.simCandles = [];
                for (let i = 0; i < 60; i++) {
                    const open = price;
                    const delta = (Math.random() - 0.5) * 0.00065;
                    const close = open + delta;
                    const max = Math.max(open, close) + Math.random() * 0.00005;
                    const min = Math.min(open, close) - Math.random() * 0.00005;
                    this.simCandles.push({ open, close, min, max });
                    price = close;
                }
            }

            _stepSimCandle() {
                const last = this.simCandles[this.simCandles.length - 1];
                const open = last.close;
                const delta = (Math.random() - 0.5) * 0.00075;
                const close = open + delta;
                const max = Math.max(open, close) + Math.random() * 0.00002;
                const min = Math.min(open, close) - Math.random() * 0.00002;
                this.simCandles.push({ open, close, min, max });
                if (this.simCandles.length > 100) this.simCandles.shift();
            }
        }

                // Intento 2: Respaldo por balance si falla el ID
                const balDespues = iq.getBalance();
                const diff = balDespues - balAntes;
                if (diff > 0) {
                    state.stats.W += 1;
                    state.balance_dinero = Math.round((state.balance_dinero + diff) * 100) / 100;
                    logMensaje(`💰 GANADA ${tipo.toUpperCase()} (+$${diff.toFixed(2)}) [BAL]`, "success");
                } else if (diff < 0) {
                    state.stats.L += 1;
                    state.balance_dinero = Math.round((state.balance_dinero - montoConfigurado) * 100) / 100;
                    logMensaje(`📉 PERDIDA ${tipo.toUpperCase()} (-$${montoConfigurado.toFixed(2)}) [BAL]`, "error");
                } else {
                    logMensaje(`⚪ EMPATE ${tipo.toUpperCase()} [BAL]`, "info");
                }
            } catch (e) {
                logMensaje(`⚠️ Error validación: ${e.message}`, "debug");
            }
        }

        // =================================================================
        // CÁLCULO DE INDICADORES (EQUIVALENTE EXACTO A PANDAS ROLLING)
        // =================================================================
        function calcularIndicadores(velas) {
            const closes = velas.map(v => v.close);
            const mins = velas.map(v => v.min);
            const maxs = velas.map(v => v.max);

            // Últimas 10 velas: verdes y rojas
            const ultimas10 = velas.slice(-10);
            const verdes = ultimas10.filter(v => v.close > v.open).length;
            const rojas = ultimas10.filter(v => v.close < v.open).length;

            // RSI (Rolling 14 SMA idéntico a pandas diff().rolling(14).mean())
            const rsiSeries = [];
            for (let i = 0; i < closes.length; i++) {
                if (i < 14) {
                    rsiSeries.push(NaN);
                    continue;
                }
                let sumGain = 0;
                let sumLoss = 0;
                for (let j = i - 13; j <= i; j++) {
                    const diff = closes[j] - closes[j - 1];
                    if (diff > 0) sumGain += diff;
                    else if (diff < 0) sumLoss += -diff;
                }
                const avgGain = sumGain / 14;
                const avgLoss = sumLoss / 14;
                const rsi = 100 - (100 / (1 + (avgGain / (avgLoss + 1e-10))));
                rsiSeries.push(rsi);
            }

            // Stochastic (14, 3) idéntico a pandas
            const rawK = [];
            for (let i = 0; i < closes.length; i++) {
                if (i < 13) {
                    rawK.push(NaN);
                    continue;
                }
                let lMin = Infinity;
                let hMax = -Infinity;
                for (let j = i - 13; j <= i; j++) {
                    if (mins[j] < lMin) lMin = mins[j];
                    if (maxs[j] > hMax) hMax = maxs[j];
                }
                const k = 100 * ((closes[i] - lMin) / (hMax - lMin + 1e-10));
                rawK.push(k);
            }

            const stochSeries = [];
            for (let i = 0; i < rawK.length; i++) {
                if (i < 15 || isNaN(rawK[i]) || isNaN(rawK[i - 1]) || isNaN(rawK[i - 2])) {
                    stochSeries.push(NaN);
                } else {
                    stochSeries.push((rawK[i] + rawK[i - 1] + rawK[i - 2]) / 3);
                }
            }

            return { verdes, rojas, rsiSeries, stochSeries };
        }

                        state.bot_corriendo = false;
                        actualizarUI();
                        break;
                    }

                    const ahora = Date.now() / 1000;
                    const velas = await iq.getCandles(asset, 60, 60, ahora);

                    if (Array.isArray(velas) && velas.length >= 14) {
                        const { verdes, rojas, rsiSeries, stochSeries } = calcularIndicadores(velas);
                        const rsiActual = rsiSeries[rsiSeries.length - 1];
                        const stochActual = stochSeries[stochSeries.length - 1];

                        // FASE 2
                        const last4Stoch = stochSeries.slice(-4);
                        if (last4Stoch.length === 4 && last4Stoch.every(v => v > 85) && !f2Local.put) {
                            f2Local.put = true;
                        }
                        if (last4Stoch.length === 4 && last4Stoch.every(v => v < 15) && !f2Local.call) {
                            f2Local.call = true;
                        }
                        if (f2Local.put && stochActual < 30) f2Local.put = false;
                        if (f2Local.call && stochActual > 70) f2Local.call = false;

                        const uV = velas[velas.length - 1];
                        const tT = Math.abs(uV.max - uV.min);
                        const cP = Math.abs(uV.open - uV.close);
                        const mO = tT > 0 ? (tT - cP) < (tT * 0.05) : false;
                        const esV = uV.close > uV.open;
                        const esR = uV.close < uV.open;

                        let op = null;
                        if (f2Local.put) {
                            if (esV && cP > 0.000290 && mO && ahora >= bloqueosLocales.put) op = "put";
                        } else if (f2Local.call) {
                            if (esR && cP > 0.000290 && mO && ahora >= bloqueosLocales.call) op = "call";
                        } else {
                            if (rsiActual < 30 && stochActual < 20) {
                                if (esR && cP < 0.000300 && ahora >= bloqueosLocales.call) op = "call";
                            } else if (rsiActual > 70 && stochActual > 80) {
                                if (esV && cP < 0.000300 && ahora >= bloqueosLocales.put) op = "put";
                            }
                        }

                        if (op) {
                            // VALIDACIONES DE BLOQUEO (RSI y 7/10)
                            const last3Rsi = rsiSeries.slice(-3);
                            if (op === "put" && last3Rsi.length === 3 && last3Rsi.every(v => v >= 70)) {
                                logMensaje("🚫 BLOQUEO RSI (ALZA). Pausa 5 min.", "warning");
                                await sleep(300000);
                                continue;
                            } else if (op === "call" && last3Rsi.length === 3 && last3Rsi.every(v => v <= 30)) {
                                logMensaje("🚫 BLOQUEO RSI (BAJADA). Pausa 5 min.", "warning");
                                await sleep(300000);
                                continue;
                            }

                            if (op === "put" && verdes >= 7) {
                                logMensaje("⚠️ 7/10 VERDES. Pausa 4 min.", "warning");
                                await sleep(240000);
                                continue;
                            }
                            if (op === "call" && rojas >= 7) {
                                logMensaje("⚠️ 7/10 ROJAS. Pausa 4 min.", "warning");
                                await sleep(240000);
                                continue;
                            }

                            const balAntes = iq.getBalance();
                            const [res, idOp] = await iq.buy(monto, asset, op, 3);
                            if (res) {
                                logMensaje(`🚀 ENTRADA ${op.toUpperCase()} de $${monto} en ${asset}`, "info");
                                await enviarTelegram(`🚀 ENTRADA ${op.toUpperCase()} de $${monto} en ${asset}`);
                                bloqueosLocales[op] = ahora + tBloq;
                                
                                // Lanzar verificación en segundo plano (sin await para no bloquear el ciclo)
                                verificarResultadoReal(idOp, op, iq, balAntes, monto);
                                
                                await sleep(tBloq * 1000);
                            }
                        }
                    }

                    await sleep(tAna * 1000);
                } catch (e) {
                    await sleep(5000);
                }
            }
        }

        // =================================================================
        // CONTROLES DE BOTONES
        // =================================================================
        function iniciarBot() {
            if (state.bot_corriendo) return;

            const u = document.getElementById("email").value;
            const p = document.getElementById("password").value;
            const asst = document.getElementById("asset").value;
            const mnt = parseFloat(document.getElementById("monto").value);
            const acc = document.getElementById("cuenta").value;
            const pV = parseFloat(document.getElementById("pips_val").value);
            const sWin = parseFloat(document.getElementById("stop_w").value);
            const sLoss = parseFloat(document.getElementById("stop_l").value);
            const modoConexion = document.getElementById("modo_conexion").value;
            const corsProxy = document.getElementById("cors_proxy").value;

            state.stats = { W: 0, L: 0 };
            state.balance_dinero = 0.0;
            state.bot_corriendo = true;
            state.id_hilo = generateUUID();

            actualizarUI();

            // Iniciar hilos asíncronos equivalentes a threading.Thread
            threadTrading(u, p, asst, mnt, acc, pV, sWin, sLoss, state.id_hilo, modoConexion, corsProxy);
            reportePeriodicoTelegram(state.id_hilo);
        }

        function pararBot() {
            if (!state.bot_corriendo) return;
            state.bot_corriendo = false;
            state.id_hilo = "";
            logMensaje("🛑 Bot detenido por el usuario.", "warning");
            actualizarUI();
        }

        // Inicializar vista
        actualizarUI();
    </script>
