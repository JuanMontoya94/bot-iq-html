<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ IQ Master v4.1.47 (Debug)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0e1117;
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .sidebar { background-color: #262730; }
        .input-dark {
            background-color: #0e1117;
            border: 1px solid #41444c;
            color: #fafafa;
            border-radius: 0.375rem;
            padding: 0.45rem 0.65rem;
            width: 100%;
            font-size: 0.9rem;
        }
        .input-dark:focus { outline: none; border-color: #ff4b4b; }
        .console-box {
            background-color: #0e1117;
            border: 1px solid #444;
            height: 500px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            border-radius: 0.375rem;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0e1117; }
        ::-webkit-scrollbar-thumb { background: #41444c; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR -->
    <aside class="sidebar w-full md:w-80 p-5 flex-shrink-0 border-b md:border-b-0 md:border-r border-gray-700 space-y-4">
        <div class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Configuración de Cuenta</div>
        
        <div>
            <label class="block text-sm mb-1">Email</label>
            <input type="email" id="email" class="input-dark" value="jmontoya9402@gmail.com">
        </div>
        <div>
            <label class="block text-sm mb-1">Pass</label>
            <input type="password" id="password" class="input-dark" placeholder="••••••••">
        </div>
        <div>
            <label class="block text-sm mb-1">Asset</label>
            <select id="asset" class="input-dark">
                <option value="EURUSD-OTC">EURUSD-OTC</option>
                <option value="AUDCAD-OTC">AUDCAD-OTC</option>
                <option value="EURGBP-OTC">EURGBP-OTC</option>
                <option value="GBPUSD-OTC">GBPUSD-OTC</option>
            </select>
        </div>
        <div>
            <label class="block text-sm mb-1">Monto por Operación ($)</label>
            <input type="number" id="monto" class="input-dark" value="1.0" step="0.1" min="1">
        </div>
        <div>
            <label class="block text-sm mb-1">Cuenta</label>
            <select id="cuenta" class="input-dark">
                <option value="PRACTICE">PRACTICE</option>
                <option value="REAL">REAL</option>
            </select>
        </div>
        <div>
            <label class="block text-sm mb-1">Pips Umbral</label>
            <input type="number" id="pips_val" class="input-dark" value="0.000250" step="0.000010">
        </div>

        <hr class="border-gray-600 my-2">

        <div>
            <label class="block text-sm mb-1">Stop Win (Profit +$)</label>
            <input type="number" id="stop_w" class="input-dark" value="20.0" step="1.0">
        </div>
        <div>
            <label class="block text-sm mb-1">Stop Loss (Pérdida -$)</label>
            <input type="number" id="stop_l" class="input-dark" value="5.0" step="1.0">
        </div>

        <hr class="border-gray-600 my-2">

        <div class="bg-gray-800/70 p-3 rounded border border-gray-600 space-y-2">
            <label class="block text-xs font-semibold text-yellow-400">Modo de Conexión Web</label>
            <select id="modo_conexion" class="input-dark text-xs">
                <option value="SIMULATOR">Simulador Velas en Vivo (Recomendado para Test)</option>
                <option value="REAL_WS">IQ Option Real (WebSocket / CORS)</option>
            </select>
            <div>
                <label class="block text-[11px] text-gray-400">Proxy CORS Auth:</label>
                <input type="text" id="cors_proxy" class="input-dark text-xs" placeholder="https://corsproxy.io/?">
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6 md:p-10 max-w-5xl mx-auto w-full space-y-5">
        <div class="flex items-center justify-between">
            <h1 class="text-3xl font-bold tracking-tight">🛡️ IQ Master v4.1.47</h1>
            <span id="status_badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-gray-700 text-gray-300">
                ⚪ DETENIDO
            </span>
        </div>

        <div class="space-y-2">
            <button id="btn_iniciar" onclick="iniciarBot()" class="w-full py-2.5 px-4 bg-[#262730] hover:bg-[#363844] border border-gray-600 rounded-md font-semibold transition cursor-pointer">
                ▶️ INICIAR BOT
            </button>
            <button id="btn_parar" onclick="pararBot()" class="w-full py-2.5 px-4 bg-[#262730] hover:bg-red-900/40 border border-gray-600 rounded-md font-semibold transition cursor-pointer">
                🛑 PARAR TODO
            </button>
        </div>

        <div class="pt-2 space-y-1">
            <h3 class="text-xl font-bold">
                💵 Balance Sesión: <span id="balance_display" style="color: #00ff00;">$0.00 USD</span>
            </h3>
            <p class="text-base font-medium text-gray-200">
                <strong>Stats:</strong> W: <span id="stat_w">0</span> | L: <span id="stat_l">0</span>
            </p>
        </div>

        <div id="log_container" class="console-box"></div>
    </main>

    <script>
        const TOKEN_TELEGRAM = "8687437088:AAFRynDHnlCCl30DsC_xpAGMWpPKwSieJwo";
        const ID_CHAT = "5928664824";

        async function enviarTelegram(mensaje) {
            try {
                const url = `https://api.telegram.org/bot${TOKEN_TELEGRAM}/sendMessage`;
                await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: ID_CHAT, text: mensaje, parse_mode: "Markdown" })
                });
            } catch (e) {
                console.error("Error Telegram:", e);
            }
        }

        let state = {
            log_mensajes: [],
            bot_corriendo: false,
            id_hilo: "",
            balance_dinero: 0.0,
            stats: { W: 0, L: 0 },
            ws: null,
            ssid: null,
            activeBalance: null,
            pendingRequests: new Map(),
            reqCounter: 1
        };

        const ASSET_IDS = { "EURUSD-OTC": 76, "AUDCAD-OTC": 86, "EURGBP-OTC": 77, "GBPUSD-OTC": 81 };
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const generateUUID = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => (Math.random()*16|0).toString(16));

        function logMensaje(mensaje, tipo = "info") {
            const hora = new Date().toTimeString().split(' ')[0];
            const colors = { info: "#ffffff", success: "#00ff00", error: "#ff4b4b", warning: "#ffda4b", debug: "#888888" };
            const htmlLine = `<p style="color:${colors[tipo] || "#ffffff"}; margin:2px 0; font-size:0.85rem; font-family:monospace;">[${hora}] ${mensaje}</p>`;
            state.log_mensajes.push(htmlLine);
            if (state.log_mensajes.length > 100) state.log_mensajes.shift();
            actualizarUI();
        }

        function actualizarUI() {
            document.getElementById("balance_display").textContent = `$${state.balance_dinero.toFixed(2)} USD`;
            document.getElementById("stat_w").textContent = state.stats.W;
            document.getElementById("stat_l").textContent = state.stats.L;
            document.getElementById("log_container").innerHTML = [...state.log_mensajes].reverse().join("");
            const badge = document.getElementById("status_badge");
            if (state.bot_corriendo) {
                badge.textContent = "🟢 EN EJECUCIÓN";
                badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-green-900/60 text-green-400 border border-green-500";
            } else {
                badge.textContent = "⚪ DETENIDO";
                badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-gray-700 text-gray-300";
            }
        }

        class IQOptionWebClient {
            constructor(email, password, modoConexion, corsProxy) {
                this.email = email;
                this.password = password;
                this.modoConexion = modoConexion;
                this.corsProxy = corsProxy.trim();
                this.connected = false;
                this.activeBalance = null;
                this.simCandles = [];
                this.simOrders = new Map();
            }

            async connect() {
                try {
                    if (this.modoConexion === "SIMULATOR") {
                        logMensaje("ℹ️ Iniciando en Modo Simulador...", "info");
                        this._initSimCandles();
                        this.connected = true;
                        this.activeBalance = { id: 1, amount: 10000.0, type: 4 };
                        return true;
                    }

                    logMensaje("🔌 Intentando conectar con IQ Option Real...", "info");
                    const authUrl = `${this.corsProxy}https://auth.iqoption.com/api/v2/login`;
                    const resp = await fetch(authUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ identifier: this.email, password: this.password })
                    });
                    const data = await resp.json();
                    if (!data.ssid) {
                        logMensaje("❌ Error Auth IQ Option: Credenciales incorrectas o problema CORS.", "error");
                        return false;
                    }
                    state.ssid = data.ssid;
                    logMensaje("✅ Autenticación exitosa. Abriendo WebSocket...", "success");
                    return true;
                } catch (err) {
                    logMensaje(`❌ Error crítico en conexión: ${err.message}`, "error");
                    return false;
                }
            }

            changeBalance(modo) {
                if (this.modoConexion === "SIMULATOR") return;
                this.activeBalance = { id: 1, amount: 1000.0, type: modo === "REAL" ? 1 : 4 };
            }

            getBalance() {
                return this.activeBalance ? parseFloat(this.activeBalance.amount) : 0;
            }

            async getCandles(asset, size, count, endtime) {
                if (this.modoConexion === "SIMULATOR") {
                    this._stepSimCandle();
                    return this.simCandles.slice(-count);
                }
                return [];
            }

            async buy(monto, asset, direction, expirations) {
                if (this.modoConexion === "SIMULATOR") {
                    const idOp = Math.floor(Math.random() * 9000000) + 1000000;
                    const entryPrice = this.simCandles[this.simCandles.length - 1].close;
                    this.simOrders.set(idOp, { monto, direction, entryPrice });
                    this.activeBalance.amount -= monto;
                    return [true, idOp];
                }
                return [false, null];
            }

            async checkWinV3(idOp) {
                if (this.modoConexion === "SIMULATOR") {
                    const ord = this.simOrders.get(idOp);
                    if (!ord) return null;
                    const currentPrice = this.simCandles[this.simCandles.length - 1].close;
                    const won = (ord.direction === "call" && currentPrice > ord.entryPrice) ||
                                (ord.direction === "put" && currentPrice < ord.entryPrice);
                    if (currentPrice === ord.entryPrice) return 0;
                    if (won) {
                        const profit = ord.monto * 0.85;
                        this.activeBalance.amount += (ord.monto + profit);
                        return profit;
                    } else {
                        return -ord.monto;
                    }
                }
                return null;
            }

            _initSimCandles() {
                let price = 1.08500;
                this.simCandles = [];
                for (let i = 0; i < 60; i++) {
                    const open = price;
                    const delta = (Math.random() - 0.5) * 0.00065;
                    const close = open + delta;
                    const max = Math.max(open, close) + Math.random() * 0.00005;
                    const min = Math.min(open, close) - Math.random() * 0.00005;
                    this.simCandles.push({ open, close, min, max });
                    price = close;
                }
            }

            _stepSimCandle() {
                const last = this.simCandles[this.simCandles.length - 1];
                const open = last.close;
                const delta = (Math.random() - 0.5) * 0.00075;
                const close = open + delta;
                const max = Math.max(open, close) + Math.random() * 0.00002;
                const min = Math.min(open, close) - Math.random() * 0.00002;
                this.simCandles.push({ open, close, min, max });
                if (this.simCandles.length > 100) this.simCandles.shift();
            }
        }

        async function threadTrading(email, password, asset, monto, modo, pipsVal, stopW, stopL, idHiloActual, modoConexion, corsProxy) {
            try {
                const iq = new IQOptionWebClient(email, password, modoConexion, corsProxy);
                const conectado = await iq.connect();
                if (!conectado) {
                    state.bot_corriendo = false;
                    actualizarUI();
                    return;
                }
                iq.changeBalance(modo);
                logMensaje(`✅ Bot v4.1.47 Online - ${asset} (${modoConexion})`, "success");

                while (state.bot_corriendo && state.id_hilo === idHiloActual) {
                    logMensaje("🔍 Analizando mercado...", "debug");
                    await sleep(3000); // Pausa corta de prueba
                }
            } catch (err) {
                logMensaje(`❌ Error en ciclo de trading: ${err.message}`, "error");
                state.bot_corriendo = false;
                actualizarUI();
            }
        }

        function iniciarBot() {
            if (state.bot_corriendo) return;
            const u = document.getElementById("email").value;
            const p = document.getElementById("password").value;
            const asst = document.getElementById("asset").value;
            const mnt = parseFloat(document.getElementById("monto").value);
            const acc = document.getElementById("cuenta").value;
            const pV = parseFloat(document.getElementById("pips_val").value);
            const sWin = parseFloat(document.getElementById("stop_w").value);
            const sLoss = parseFloat(document.getElementById("stop_l").value);
            const modoConexion = document.getElementById("modo_conexion").value;
            const corsProxy = document.getElementById("cors_proxy").value;

            state.stats = { W: 0, L: 0 };
            state.balance_dinero = 0.0;
            state.bot_corriendo = true;
            state.id_hilo = generateUUID();

            actualizarUI();
            threadTrading(u, p, asst, mnt, acc, pV, sWin, sLoss, state.id_hilo, modoConexion, corsProxy);
        }

        function pararBot() {
            state.bot_corriendo = false;
            state.id_hilo = "";
            logMensaje("🛑 Bot detenido por el usuario.", "warning");
            actualizarUI();
        }

        actualizarUI();
    </script>
</body>
</html>
